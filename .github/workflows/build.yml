
name: Build Zorvex Radio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/zorvex/radio
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ZorvexRadio"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.zorvex.radio'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.zorvex.radio'
                  minSdk 23
                  targetSdk 35
                  versionCode 7
                  versionName '7.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.annotation:annotation:1.8.2'
              implementation 'androidx.media3:media3-exoplayer:1.5.1'
              implementation 'androidx.media3:media3-session:1.5.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="false"
                  android:label="Zorvex Radio"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".RadioService"
                      android:exported="true"
                      android:foregroundServiceType="mediaPlayback">
                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaSessionService" />
                      </intent-filter>
                  </service>

              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#8B5CF6</item>
                  <item name="android:statusBarColor">#101018</item>
                  <item name="android:navigationBarColor">#101018</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/zorvex/radio/RadioService.java <<'EOF'
          package com.zorvex.radio;

          import android.content.Intent;
          import android.net.Uri;
          import android.text.TextUtils;

          import androidx.media3.common.MediaItem;
          import androidx.media3.common.MediaMetadata;
          import androidx.media3.common.Player;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.session.MediaSession;
          import androidx.media3.session.MediaSessionService;

          public class RadioService extends MediaSessionService {
              public static final String ACTION_PLAY =
                      "com.zorvex.radio.PLAY";
              public static final String ACTION_PAUSE =
                      "com.zorvex.radio.PAUSE";
              public static final String EXTRA_URL = "stream_url";
              public static final String EXTRA_TITLE = "stream_title";

              private ExoPlayer player;
              private MediaSession mediaSession;

              @Override
              public void onCreate() {
                  super.onCreate();

                  player = new ExoPlayer.Builder(this).build();
                  mediaSession = new MediaSession.Builder(this, player).build();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  int result = super.onStartCommand(intent, flags, startId);

                  if (intent == null || player == null) {
                      return result;
                  }

                  String action = intent.getAction();

                  if (ACTION_PLAY.equals(action)) {
                      String url = intent.getStringExtra(EXTRA_URL);
                      String title = intent.getStringExtra(EXTRA_TITLE);

                      if (!TextUtils.isEmpty(url)) {
                          Uri uri = Uri.parse(url);
                          String scheme = uri.getScheme();

                          if (uri.isAbsolute()
                                  && ("https".equalsIgnoreCase(scheme)
                                  || "http".equalsIgnoreCase(scheme))) {
                              MediaMetadata metadata =
                                      new MediaMetadata.Builder()
                                              .setTitle(TextUtils.isEmpty(title)
                                                      ? "Zorvex Radio" : title)
                                              .setArtist("Zorvex Radio")
                                              .build();

                              MediaItem item = new MediaItem.Builder()
                                      .setUri(uri)
                                      .setMediaMetadata(metadata)
                                      .build();

                              player.setMediaItem(item);
                              player.prepare();
                              player.play();
                          }
                      }
                  } else if (ACTION_PAUSE.equals(action)) {
                      player.pause();
                  }

                  return result;
              }

              @Override
              public MediaSession onGetSession(
                      MediaSession.ControllerInfo controllerInfo) {
                  return mediaSession;
              }

              @Override
              public void onDestroy() {
                  if (mediaSession != null) {
                      mediaSession.release();
                      mediaSession = null;
                  }

                  if (player != null) {
                      player.release();
                      player = null;
                  }

                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/java/com/zorvex/radio/MainActivity.java <<'EOF'
          package com.zorvex.radio;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private static final String WEBSITE =
                      "https://musikzorvexxxxxxxxxxteam.netlify.app";

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setMediaPlaybackRequiresUserGesture(false);
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.addJavascriptInterface(new RadioBridge(), "AndroidRadio");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();

                          return !("https".equalsIgnoreCase(scheme)
                                  || "http".equalsIgnoreCase(scheme));
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          injectAudioBridge(view);
                      }
                  });

                  setContentView(webView);

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl(WEBSITE);
                  }
              }

              private void injectAudioBridge(WebView view) {
                  String script =
                          "(function() {" +
                          "function hookAudio() {" +
                          "document.querySelectorAll('audio,video').forEach(function(el) {" +
                          "if (el.dataset.zorvexHooked) return;" +
                          "el.dataset.zorvexHooked = '1';" +
                          "el.addEventListener('play', function() {" +
                          "var url = el.currentSrc || el.src;" +
                          "if (url && /^https?:\\\\/\\\\//i.test(url) && window.AndroidRadio) {" +
                          "el.pause();" +
                          "window.AndroidRadio.playRadio(url, document.title || 'Zorvex Radio');" +
                          "}" +
                          "});" +
                          "});" +
                          "}" +
                          "hookAudio();" +
                          "new MutationObserver(hookAudio).observe(document.documentElement," +
                          "{childList:true,subtree:true});" +
                          "})();";

                  view.evaluateJavascript(script, null);
              }

              private class RadioBridge {
                  @JavascriptInterface
                  public void playRadio(String url, String title) {
                      if (url == null) return;

                      Uri uri = Uri.parse(url);
                      String scheme = uri.getScheme();

                      if (!uri.isAbsolute()
                              || !("https".equalsIgnoreCase(scheme)
                              || "http".equalsIgnoreCase(scheme))) {
                          return;
                      }

                      Intent intent = new Intent(MainActivity.this, RadioService.class);
                      intent.setAction(RadioService.ACTION_PLAY);
                      intent.putExtra(RadioService.EXTRA_URL, url);
                      intent.putExtra(RadioService.EXTRA_TITLE,
                              title == null ? "Zorvex Radio" : title);

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(intent);
                      } else {
                          startService(intent);
                      }
                  }

                  @JavascriptInterface
                  public void pauseRadio() {
                      Intent intent = new Intent(MainActivity.this, RadioService.class);
                      intent.setAction(RadioService.ACTION_PAUSE);
                      startService(intent);
                  }
              }

              @Override
              public void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (webView != null) {
                      webView.saveState(outState);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.removeJavascriptInterface("AndroidRadio");
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Download Gradle
        run: |
          set -euo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleDebug

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zorvex-Radio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
