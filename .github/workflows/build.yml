
name: Build Zorvex Radio APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android application
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/zorvex/radio
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ZorvexRadio"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.zorvex.radio'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.zorvex.radio'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }
          }

          dependencies {
              implementation 'androidx.media3:media3-exoplayer:1.5.1'
              implementation 'androidx.media3:media3-session:1.5.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Zorvex Radio"
                  android:usesCleartextTraffic="true"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".RadioService"
                      android:exported="true"
                      android:foregroundServiceType="mediaPlayback">
                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaSessionService"/>
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#8B5CF6</item>
                  <item name="android:statusBarColor">#101018</item>
                  <item name="android:navigationBarColor">#101018</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/zorvex/radio/RadioService.java <<'EOF'
          package com.zorvex.radio;

          import android.content.Intent;
          import android.net.Uri;
          import androidx.annotation.Nullable;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.MediaMetadata;
          import androidx.media3.common.Player;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.session.MediaSession;
          import androidx.media3.session.MediaSessionService;

          public class RadioService extends MediaSessionService {
              private ExoPlayer player;
              private MediaSession session;

              @Override
              public void onCreate() {
                  super.onCreate();
                  player = new ExoPlayer.Builder(this).build();
                  session = new MediaSession.Builder(this, player).build();
              }

              @Nullable
              @Override
              public MediaSession onGetSession(
                      MediaSession.ControllerInfo controllerInfo) {
                  return session;
              }

              @Override
              public int onStartCommand(
                      Intent intent, int flags, int startId) {
                  int result = super.onStartCommand(intent, flags, startId);

                  if (intent != null &&
                      "PLAY_RADIO".equals(intent.getAction())) {
                      String url = intent.getStringExtra("url");
                      String title = intent.getStringExtra("title");

                      if (url != null && !url.trim().isEmpty()) {
                          MediaMetadata metadata =
                              new MediaMetadata.Builder()
                                  .setTitle(title == null
                                      ? "Zorvex Radio" : title)
                                  .setArtist("Zorvex Radio")
                                  .build();

                          MediaItem item = new MediaItem.Builder()
                              .setUri(Uri.parse(url))
                              .setMediaMetadata(metadata)
                              .build();

                          player.setMediaItem(item);
                          player.prepare();
                          player.play();
                      }
                  } else if (intent != null &&
                      "PAUSE_RADIO".equals(intent.getAction())) {
                      player.pause();
                  }

                  return result;
              }

              @Override
              public void onDestroy() {
                  if (session != null) {
                      session.release();
                      session = null;
                  }
                  if (player != null) {
                      player.release();
                      player = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/java/com/zorvex/radio/MainActivity.java <<'EOF'
          package com.zorvex.radio;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private final Handler handler = new Handler(Looper.getMainLooper());

              private final Runnable injectTask = new Runnable() {
                  @Override
                  public void run() {
                      if (webView != null) {
                          injectBridge();
                          handler.postDelayed(this, 1000);
                      }
                  }
              };

              public class RadioBridge {
                  @JavascriptInterface
                  public void playRadio(String url, String title) {
                      if (url == null || url.isEmpty()) return;

                      runOnUiThread(() -> {
                          Intent intent = new Intent(
                              MainActivity.this, RadioService.class);
                          intent.setAction("PLAY_RADIO");
                          intent.putExtra("url", url);
                          intent.putExtra("title",
                              title == null ? "Zorvex Radio" : title);

                          if (Build.VERSION.SDK_INT >= 26) {
                              startForegroundService(intent);
                          } else {
                              startService(intent);
                          }
                      });
                  }

                  @JavascriptInterface
                  public void pauseRadio() {
                      runOnUiThread(() -> {
                          Intent intent = new Intent(
                              MainActivity.this, RadioService.class);
                          intent.setAction("PAUSE_RADIO");
                          startService(intent);
                      });
                  }
              }

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                          new String[]{Manifest.permission.POST_NOTIFICATIONS}, 10);
                  }

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.addJavascriptInterface(new RadioBridge(), "AndroidRadio");
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          injectBridge();
                      }
                  });

                  webView.loadUrl(
                      "https://musikzorvexxxxxxxxxxteam.netlify.app");
                  handler.postDelayed(injectTask, 1000);
              }

              private void injectBridge() {
                  String script =
                      "(function(){" +
                      "if(window.__zrvBridgeInstalled)return;" +
                      "window.__zrvBridgeInstalled=true;" +
                      "var originalPlay=HTMLMediaElement.prototype.play;" +
                      "var originalPause=HTMLMediaElement.prototype.pause;" +
                      "HTMLMediaElement.prototype.play=function(){" +
                      "if(this.tagName==='AUDIO'&&window.AndroidRadio){" +
                      "var u=this.currentSrc||this.src;" +
                      "if(u){" +
                      "window.AndroidRadio.playRadio(u," +
                      "document.title||'Zorvex Radio');" +
                      "this.dispatchEvent(new Event('play'));" +
                      "return Promise.resolve();" +
                      "}}" +
                      "return originalPlay.apply(this,arguments);" +
                      "};" +
                      "HTMLMediaElement.prototype.pause=function(){" +
                      "if(this.tagName==='AUDIO'&&window.AndroidRadio){" +
                      "window.AndroidRadio.pauseRadio();" +
                      "this.dispatchEvent(new Event('pause'));" +
                      "return;" +
                      "}" +
                      "return originalPause.apply(this,arguments);" +
                      "};" +
                      "})();";

                  webView.evaluateJavascript(script, null);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacks(injectTask);
                  if (webView != null) {
                      webView.removeJavascriptInterface("AndroidRadio");
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Zorvex-Radio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
