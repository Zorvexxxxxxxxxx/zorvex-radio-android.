
name: Build Zorvex Radio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/zorvex/radio
          mkdir -p app/src/main/res/values

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'ZorvexRadio'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.zorvex.radio'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.zorvex.radio'
                  minSdk 23
                  targetSdk 35
                  versionCode 6
                  versionName '6.0'
              }
          }

          dependencies {
              implementation 'androidx.annotation:annotation:1.8.2'
              implementation 'androidx.media3:media3-exoplayer:1.5.1'
              implementation 'androidx.media3:media3-session:1.5.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:label="Zorvex Radio"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".RadioService"
                      android:exported="true"
                      android:foregroundServiceType="mediaPlayback">
                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaSessionService"/>
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:colorAccent">#8B5CF6</item>
                  <item name="android:statusBarColor">#101018</item>
                  <item name="android:navigationBarColor">#101018</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/zorvex/radio/RadioService.java <<'EOF'
          package com.zorvex.radio;

          import android.content.Intent;
          import android.net.Uri;
          import androidx.annotation.Nullable;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.MediaMetadata;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.session.MediaSession;
          import androidx.media3.session.MediaSessionService;

          public class RadioService extends MediaSessionService {
              private ExoPlayer player;
              private MediaSession session;

              @Override
              public void onCreate() {
                  super.onCreate();
                  player = new ExoPlayer.Builder(this).build();
                  session = new MediaSession.Builder(this, player).build();
              }

              @Nullable
              @Override
              public MediaSession onGetSession(MediaSession.ControllerInfo info) {
                  return session;
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  int result = super.onStartCommand(intent, flags, startId);

                  if (intent != null &&
                      "PLAY_RADIO".equals(intent.getAction())) {
                      String url = intent.getStringExtra("url");
                      String title = intent.getStringExtra("title");

                      if (url != null && !url.trim().isEmpty()) {
                          MediaMetadata metadata = new MediaMetadata.Builder()
                              .setTitle(title == null ? "Zorvex Radio" : title)
                              .setArtist("Zorvex Radio")
                              .build();

                          MediaItem item = new MediaItem.Builder()
                              .setUri(Uri.parse(url))
                              .setMediaMetadata(metadata)
                              .build();

                          player.setMediaItem(item);
                          player.prepare();
                          player.play();
                      }
                  } else if (intent != null &&
                      "PAUSE_RADIO".equals(intent.getAction())) {
                      player.pause();
                  }

                  return result;
              }

              @Override
              public void onDestroy() {
                  if (session != null) session.release();
                  if (player != null) player.release();
                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/java/com/zorvex/radio/MainActivity.java <<'EOF'
          package com.zorvex.radio;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              public class RadioBridge {
                  @JavascriptInterface
                  public void playRadio(String url, String title) {
                      if (url == null || url.trim().isEmpty()) return;

                      runOnUiThread(() -> {
                          Intent intent = new Intent(
                              MainActivity.this, RadioService.class);
                          intent.setAction("PLAY_RADIO");
                          intent.putExtra("url", url);
                          intent.putExtra("title", title);

                          if (Build.VERSION.SDK_INT >= 26) {
                              startForegroundService(intent);
                          } else {
                              startService(intent);
                          }
                      });
                  }

                  @JavascriptInterface
                  public void pauseRadio() {
                      Intent intent = new Intent(
                          MainActivity.this, RadioService.class);
                      intent.setAction("PAUSE_RADIO");
                      startService(intent);
                  }
              }

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                          new String[]{Manifest.permission.POST_NOTIFICATIONS}, 10);
                  }

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.addJavascriptInterface(new RadioBridge(), "AndroidRadio");
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl(
                      "https://musikzorvexxxxxxxxxxteam.netlify.app");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.removeJavascriptInterface("AndroidRadio");
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zorvex-Radio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
EOF

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zorvex-Radio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
